<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理院地図ビューア</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute; top: 10px; left: 54px; z-index: 1000;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    background: #fff; padding: 6px 8px; border-radius: 6px;
    box-shadow: 0 1px 5px rgba(0,0,0,.35);
  }
  .panel input[type=search] {
    width: 200px; padding: 6px 8px; font-size: 14px;
    border: 1px solid #bbb; border-radius: 4px;
  }
  button {
    padding: 6px 10px; font-size: 14px; cursor: pointer;
    border: 1px solid #1a5fb4; background: #1a5fb4; color: #fff; border-radius: 4px;
  }
  button.sub { background: #fff; color: #1a5fb4; }
  button.on  { background: #c01c28; border-color: #c01c28; color: #fff; }
  button.small { padding: 2px 6px; font-size: 12px; }

  #results {
    position: absolute; top: 56px; left: 54px; z-index: 1000;
    max-height: 50vh; overflow-y: auto; width: 320px;
    background: #fff; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.35);
    display: none; font-size: 14px;
  }
  #results div { padding: 8px 10px; border-bottom: 1px solid #eee; cursor: pointer; }
  #results div:hover { background: #eef4fc; }

  /* GISデータパネル */
  #gisPanel {
    position: absolute; left: 10px; bottom: 36px; z-index: 1000;
    width: 300px; max-height: 45vh; overflow-y: auto;
    background: #fff; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.35);
    font-size: 13px;
  }
  #gisPanel h3 {
    margin: 0; padding: 8px 10px; font-size: 14px; background: #1a5fb4; color: #fff;
    border-radius: 6px 6px 0 0; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; user-select: none;
  }
  #gisBody { padding: 8px 10px; }
  #gisPanel.collapsed #gisBody { display: none; }
  #gisPanel.collapsed h3 { border-radius: 6px; }
  .drop {
    border: 2px dashed #9ab; border-radius: 6px; padding: 10px; text-align: center;
    color: #456; cursor: pointer; line-height: 1.5;
  }
  .drop:hover { background: #f3f7fc; }
  .urlrow { display: flex; gap: 4px; margin-top: 8px; }
  .urlrow input { flex: 1; min-width: 0; padding: 4px 6px; font-size: 12px; border: 1px solid #bbb; border-radius: 4px; }
  #layerList { margin-top: 8px; }
  .layer {
    display: flex; align-items: center; gap: 6px; padding: 5px 0; border-top: 1px solid #eee;
  }
  .layer .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer input[type=color] { width: 24px; height: 22px; padding: 0; border: none; background: none; cursor: pointer; }
  #gisMsg { margin-top: 6px; color: #c01c28; font-size: 12px; min-height: 1em; }

  body.dragging #map::after {
    content: "ここにファイルをドロップ"; position: absolute; inset: 0; z-index: 2000;
    display: flex; align-items: center; justify-content: center;
    background: rgba(26,95,180,.25); color: #fff; font-size: 28px; font-weight: bold;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }

  .info {
    background: rgba(255,255,255,.9); padding: 4px 8px; border-radius: 4px;
    font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .crosshair {
    position: absolute; top: 50%; left: 50%; z-index: 900; pointer-events: none;
    width: 24px; height: 24px; margin: -12px 0 0 -12px;
  }
  .crosshair::before, .crosshair::after { content: ""; position: absolute; background: #d00; }
  .crosshair::before { left: 11px; top: 0; width: 2px; height: 24px; }
  .crosshair::after  { top: 11px; left: 0; height: 2px; width: 24px; }

  .popup-table { border-collapse: collapse; font-size: 12px; }
  .popup-table th, .popup-table td { border: 1px solid #ddd; padding: 2px 6px; text-align: left; vertical-align: top; }
  .popup-table th { background: #f4f6f8; white-space: nowrap; }
  .leaflet-popup-content { max-height: 260px; overflow-y: auto; }

  /* 現在地マーカー（脈打つ青い点） */
  .me-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #1a73e8;
    border: 3px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,.5); box-sizing: border-box;
    position: relative;
  }
  .me-dot::after {
    content: ""; position: absolute; inset: -9px; border-radius: 50%;
    background: rgba(26,115,232,.35); animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

  @media (max-width: 600px) {
    .panel { left: 50px; right: 10px; }
    .panel input[type=search] { width: auto; flex: 1; min-width: 0; }
    #results { left: 10px; right: 10px; width: auto; }
    #gisPanel { width: auto; right: 10px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="crosshair"></div>

<form class="panel" id="searchForm">
  <input id="q" type="search" placeholder="地名・住所で検索（例：富士山）">
  <button type="submit">検索</button>
  <button type="button" class="sub" id="locateBtn" title="現在地の表示・追跡">📍 現在地</button>
  <label style="font-size:12px;display:flex;align-items:center;gap:3px;">
    <input type="checkbox" id="followChk" checked>追従
  </label>
</form>
<div id="results"></div>

<div id="gisPanel">
  <h3 id="gisHeader"><span>GISデータ</span><span id="gisToggle">▾</span></h3>
  <div id="gisBody">
    <div class="drop" id="dropArea">
      クリックで選択 / 地図にドラッグ＆ドロップ<br>
      <small>GeoJSON・KML・KMZ・GPX・Shapefile(zip)・CSV</small>
    </div>
    <input type="file" id="fileInput" multiple
           accept=".geojson,.json,.kml,.kmz,.gpx,.zip,.csv,.txt" hidden>
    <div class="urlrow">
      <input id="urlInput" type="url" placeholder="GeoJSON等のURLを読み込む">
      <button class="small" id="urlBtn">読込</button>
    </div>
    <div id="gisMsg"></div>
    <div id="layerList"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
<script src="https://unpkg.com/shpjs@4.0.4/dist/shp.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
/* ================= 地理院タイル ================= */
const ATTR = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>';
const gsi = (id, ext, opt = {}) =>
  L.tileLayer(`https://cyberjapandata.gsi.go.jp/xyz/${id}/{z}/{x}/{y}.${ext}`, {
    attribution: ATTR, maxNativeZoom: 18, maxZoom: 20, ...opt
  });

const baseLayers = {
  "標準地図": gsi("std", "png"),
  "淡色地図": gsi("pale", "png"),
  "白地図":   gsi("blank", "png", { maxNativeZoom: 14 }),
  "写真":     gsi("seamlessphoto", "jpg"),
  "English":  gsi("english", "png", { minZoom: 5, maxNativeZoom: 11 })
};
const overlays = {
  "陰影起伏図": gsi("hillshademap", "png", { opacity: 0.5, maxNativeZoom: 16 }),
  "色別標高図": gsi("relief", "png", { opacity: 0.5, maxNativeZoom: 15 }),
  "傾斜量図":   gsi("slopemap", "png", { opacity: 0.5, maxNativeZoom: 15 })
};

const map = L.map("map", {
  center: [35.681236, 139.767125], zoom: 13,
  layers: [baseLayers["標準地図"]]
});
const layerControl = L.control.layers(baseLayers, overlays, { collapsed: window.innerWidth < 600 }).addTo(map);
L.control.scale({ imperial: false, position: "bottomright" }).addTo(map);

/* 中心座標表示 */
const Info = L.Control.extend({
  options: { position: "bottomright" },
  onAdd() { this._div = L.DomUtil.create("div", "info"); return this._div; },
  update() {
    const c = map.getCenter();
    this._div.textContent = `中心: ${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}  ズーム: ${map.getZoom()}`;
  }
});
const info = new Info().addTo(map);
info.update();
map.on("move zoomend", () => info.update());

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ================= クリック地点の標高 ================= */
map.on("click", async (e) => {
  document.getElementById("results").style.display = "none";
  const { lat, lng } = e.latlng;
  const base = `緯度: ${lat.toFixed(6)}<br>経度: ${lng.toFixed(6)}`;
  const popup = L.popup().setLatLng(e.latlng).setContent(`${base}<br>標高: 取得中…`).openOn(map);
  try {
    const r = await fetch(`https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${lng}&lat=${lat}&outtype=JSON`);
    const d = await r.json();
    const elev = (d.elevation === "-----") ? "データなし" : `${d.elevation} m（${esc(d.hsrc)}）`;
    popup.setContent(`${base}<br>標高: ${elev}`);
  } catch {
    popup.setContent(`${base}<br>標高: 取得できませんでした`);
  }
});

/* ================= 地名検索 ================= */
const results = document.getElementById("results");
let searchMarker = null;
document.getElementById("searchForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  results.style.display = "block";
  results.innerHTML = "<div>検索中…</div>";
  try {
    const r = await fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(q)}`);
    const list = await r.json();
    if (!list.length) { results.innerHTML = "<div>見つかりませんでした</div>"; return; }
    results.innerHTML = "";
    list.slice(0, 30).forEach(f => {
      const [lng, lat] = f.geometry.coordinates;
      const row = document.createElement("div");
      row.textContent = f.properties.title;
      row.onclick = () => {
        map.setView([lat, lng], 16);
        if (searchMarker) searchMarker.remove();
        searchMarker = L.marker([lat, lng]).addTo(map).bindPopup(esc(f.properties.title)).openPopup();
        results.style.display = "none";
      };
      results.appendChild(row);
    });
  } catch {
    results.innerHTML = "<div>検索に失敗しました</div>";
  }
});

/* ================= 現在地の表示・追跡 ================= */
const locateBtn = document.getElementById("locateBtn");
const followChk = document.getElementById("followChk");
let watchId = null, meMarker = null, meCircle = null, firstFix = true;

function stopTracking() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  meMarker?.remove(); meCircle?.remove();
  meMarker = meCircle = null;
  locateBtn.classList.remove("on");
  locateBtn.textContent = "📍 現在地";
}

function startTracking() {
  if (!navigator.geolocation) { showMsg("このブラウザは位置情報に対応していません"); return; }
  firstFix = true;
  locateBtn.classList.add("on");
  locateBtn.textContent = "📍 取得中…";
  watchId = navigator.geolocation.watchPosition(onPosition, onPosError,
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

function onPosition(pos) {
  const { latitude: lat, longitude: lng, accuracy, altitude } = pos.coords;
  const ll = [lat, lng];
  const txt = `<b>現在地</b><br>緯度: ${lat.toFixed(6)}<br>経度: ${lng.toFixed(6)}` +
              `<br>精度: 約${Math.round(accuracy)} m` +
              (altitude != null ? `<br>GPS高度: ${altitude.toFixed(1)} m` : "") +
              `<br><small>${new Date(pos.timestamp).toLocaleTimeString()}</small>`;
  if (!meMarker) {
    meCircle = L.circle(ll, { radius: accuracy, color: "#1a73e8", weight: 1, fillOpacity: 0.12, interactive: false }).addTo(map);
    meMarker = L.marker(ll, {
      icon: L.divIcon({ className: "", html: '<div class="me-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }),
      zIndexOffset: 1000
    }).addTo(map).bindPopup(txt);
  } else {
    meMarker.setLatLng(ll).setPopupContent(txt);
    meCircle.setLatLng(ll).setRadius(accuracy);
  }
  locateBtn.textContent = "📍 現在地 ON";
  if (firstFix) {
    map.setView(ll, Math.max(map.getZoom(), 16));
    firstFix = false;
  } else if (followChk.checked) {
    map.panTo(ll);
  }
}

function onPosError(err) {
  const msgs = { 1: "位置情報の利用が許可されていません", 2: "現在地を特定できませんでした", 3: "位置情報の取得がタイムアウトしました" };
  showMsg(msgs[err.code] || "位置情報を取得できませんでした");
  stopTracking();
}

locateBtn.addEventListener("click", () => watchId === null ? startTracking() : stopTracking());
// 地図を手で動かしたら追従を外す
map.on("dragstart", () => { if (watchId !== null) followChk.checked = false; });

/* ================= GISデータの読み込み ================= */
const COLORS = ["#e01b24", "#2ec27e", "#9141ac", "#f5c211", "#ff7800", "#1c71d8", "#865e3c", "#e66100"];
let colorIdx = 0;
const gisLayers = [];
const gisMsg = document.getElementById("gisMsg");
function showMsg(m) { gisMsg.textContent = m; if (m) setTimeout(() => { if (gisMsg.textContent === m) gisMsg.textContent = ""; }, 6000); }

function propsTable(p) {
  if (!p) return "";
  const rows = Object.entries(p)
    .filter(([k, v]) => v !== null && v !== "" && typeof v !== "object")
    .map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("");
  return rows ? `<table class="popup-table">${rows}</table>` : "<i>属性なし</i>";
}

function addGeoJSON(geojson, name) {
  const color = COLORS[colorIdx++ % COLORS.length];
  const style = { color, weight: 3, opacity: 0.9, fillColor: color, fillOpacity: 0.3 };
  const layer = L.geoJSON(geojson, {
    style: () => style,
    pointToLayer: (f, ll) => L.circleMarker(ll, { ...style, radius: 6, fillOpacity: 0.8, color: "#fff", weight: 1.5, fillColor: color }),
    onEachFeature: (f, l) => {
      const title = f.properties?.name || f.properties?.名称 || f.properties?.title;
      l.bindPopup((title ? `<b>${esc(title)}</b><br>` : "") + propsTable(f.properties));
    }
  }).addTo(map);

  const count = layer.getLayers().length;
  if (!count) { layer.remove(); showMsg(`${name}: 表示できる地物がありませんでした`); return; }

  const entry = { name, layer, color };
  gisLayers.push(entry);
  layerControl.addOverlay(layer, esc(name));
  renderLayerList();
  try { map.fitBounds(layer.getBounds(), { padding: [30, 30], maxZoom: 17 }); } catch {}
  showMsg("");
}

function renderLayerList() {
  const box = document.getElementById("layerList");
  box.innerHTML = "";
  gisLayers.forEach((e, i) => {
    const row = document.createElement("div");
    row.className = "layer";
    row.innerHTML = `
      <input type="checkbox" ${map.hasLayer(e.layer) ? "checked" : ""} title="表示/非表示">
      <input type="color" value="${e.color}" title="色を変更">
      <span class="name" title="${esc(e.name)}">${esc(e.name)} <small>(${e.layer.getLayers().length})</small></span>
      <button class="small sub" title="範囲へ移動">⤢</button>
      <button class="small sub" title="削除">✕</button>`;
    const [chk, col, , zoomBtn, delBtn] = row.children;
    chk.onchange = () => chk.checked ? e.layer.addTo(map) : e.layer.remove();
    col.oninput = () => {
      e.color = col.value;
      e.layer.eachLayer(l => {
        if (l instanceof L.CircleMarker) l.setStyle({ fillColor: col.value });
        else l.setStyle({ color: col.value, fillColor: col.value });
      });
    };
    zoomBtn.onclick = () => map.fitBounds(e.layer.getBounds(), { padding: [30, 30], maxZoom: 17 });
    delBtn.onclick = () => {
      e.layer.remove();
      layerControl.removeLayer(e.layer);
      gisLayers.splice(i, 1);
      renderLayerList();
    };
    box.appendChild(row);
  });
}
// レイヤーコントロール側でON/OFFしたときにチェックを同期
map.on("overlayadd overlayremove", renderLayerList);

/* --- 形式ごとの変換 --- */
function parseXML(text) { return new DOMParser().parseFromString(text, "text/xml"); }

function csvToGeoJSON(text) {
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
  const split = l => {               // ダブルクォート対応の簡易CSVパーサ
    const out = []; let cur = "", q = false;
    for (let i = 0; i < l.length; i++) {
      const c = l[i];
      if (q) { if (c === '"' && l[i+1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
      else if (c === '"') q = true;
      else if (c === "," || c === "\t") { out.push(cur); cur = ""; }
      else cur += c;
    }
    out.push(cur); return out.map(s => s.trim());
  };
  const head = split(lines[0]);
  const find = re => head.findIndex(h => re.test(h));
  const iLat = find(/^(lat|latitude|緯度|y)$/i);
  const iLng = find(/^(lon|lng|long|longitude|経度|x)$/i);
  if (iLat < 0 || iLng < 0) throw new Error("CSVに緯度・経度の列（lat/lon、緯度/経度 など）が見つかりません");
  const features = [];
  for (const l of lines.slice(1)) {
    const v = split(l);
    const lat = parseFloat(v[iLat]), lng = parseFloat(v[iLng]);
    if (!isFinite(lat) || !isFinite(lng)) continue;
    const props = {}; head.forEach((h, i) => props[h] = v[i]);
    features.push({ type: "Feature", properties: props, geometry: { type: "Point", coordinates: [lng, lat] } });
  }
  return { type: "FeatureCollection", features };
}

async function loadFile(file) {
  const name = file.name;
  const ext = name.split(".").pop().toLowerCase();
  try {
    let gj;
    if (ext === "geojson" || ext === "json") {
      gj = JSON.parse(await file.text());
    } else if (ext === "kml") {
      gj = toGeoJSON.kml(parseXML(await file.text()));
    } else if (ext === "gpx") {
      gj = toGeoJSON.gpx(parseXML(await file.text()));
    } else if (ext === "kmz") {
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const kmlFile = Object.values(zip.files).find(f => f.name.toLowerCase().endsWith(".kml"));
      if (!kmlFile) throw new Error("KMZ内にKMLが見つかりません");
      gj = toGeoJSON.kml(parseXML(await kmlFile.async("text")));
    } else if (ext === "zip") {
      gj = await shp(await file.arrayBuffer());  // .prj があれば緯度経度へ自動変換
      if (Array.isArray(gj)) {                    // zip内に複数のシェープがある場合
        gj.forEach(g => addGeoJSON(g, `${name} / ${g.fileName || ""}`));
        return;
      }
    } else if (ext === "csv" || ext === "txt") {
      gj = csvToGeoJSON(await file.text());
    } else {
      throw new Error("未対応の形式です");
    }
    addGeoJSON(gj, name);
  } catch (err) {
    console.error(err);
    showMsg(`${name}: 読み込めませんでした（${err.message}）`);
  }
}

async function loadURL(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const name = decodeURIComponent(url.split("/").pop().split("?")[0]) || url;
    const blob = await r.blob();
    await loadFile(new File([blob], /\.\w+$/.test(name) ? name : name + ".geojson"));
  } catch (err) {
    showMsg(`URLを読み込めませんでした（${err.message}）。相手サーバーがCORSを許可していない可能性があります`);
  }
}

/* --- UI --- */
const fileInput = document.getElementById("fileInput");
document.getElementById("dropArea").onclick = () => fileInput.click();
fileInput.onchange = () => { [...fileInput.files].forEach(loadFile); fileInput.value = ""; };
document.getElementById("urlBtn").onclick = () => {
  const u = document.getElementById("urlInput").value.trim();
  if (u) loadURL(u);
};
document.getElementById("gisHeader").onclick = () => {
  const p = document.getElementById("gisPanel");
  p.classList.toggle("collapsed");
  document.getElementById("gisToggle").textContent = p.classList.contains("collapsed") ? "▸" : "▾";
};

let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
window.addEventListener("dragleave", e => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  [...e.dataTransfer.files].forEach(loadFile);
});
</script>
</body>
</html>
